name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Publish to gh-pages
        working-directory: ./dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

      - name: Point Pages at gh-pages branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY}"
          api="https://api.github.com/repos/$repo/pages"
          echo "PUT $api -> source=gh-pages"
          code=$(curl -s -o /tmp/p.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api" -d '{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}')
          echo "-> HTTP $code"; cat /tmp/p.json 2>/dev/null || true; echo
          if [ "$code" = "404" ]; then
            echo "No Pages site yet; creating one on gh-pages"
            code=$(curl -s -o /tmp/p.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$api" -d '{"source":{"branch":"gh-pages","path":"/"}}')
            echo "-> HTTP $code"; cat /tmp/p.json 2>/dev/null || true; echo
          fi
