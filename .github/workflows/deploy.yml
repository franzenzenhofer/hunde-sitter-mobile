name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # publish the built site to the gh-pages branch

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Deploy by publishing the built site to the gh-pages branch. This is a
      # plain git push (contents:write) — it does NOT use the GitHub Pages API,
      # which the Actions token isn't permitted to call here ("Resource not
      # accessible by integration"). Serve it via Settings → Pages → Source =
      # "Deploy from a branch" → gh-pages → / (root). CNAME keeps the domain.
      - name: Publish built site to gh-pages
        if: github.event_name != 'pull_request'
        working-directory: ./dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
