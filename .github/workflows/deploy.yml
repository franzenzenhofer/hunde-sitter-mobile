name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # write: also publish a gh-pages branch as a fallback source
  pages: write
  id-token: write

# One publish at a time; never cancel a running one mid-deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Only the real deploy needs the artifact; PRs validate but don't publish.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      # Belt-and-suspenders: also publish the built site to a gh-pages branch.
      # If Pages is set to "Deploy from a branch", this updates the live URL even
      # when the Actions deploy path is unavailable. Never fails the gate.
      - name: Publish to gh-pages branch (fallback source)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        working-directory: ./dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

  deploy:
    name: Deploy (GitHub Actions source)
    needs: ci
    # Never deploy from a pull request — only push to main / manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages with the "GitHub Actions" source if it isn't
          # already — fixes a deploy-pages step that fails in ~3s with "Pages not
          # enabled". Idempotent when already configured.
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
